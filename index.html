<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 밤 주인공은 나야나</title>
  <link rel="icon" href="data:,">  <!-- 아이콘 파일이 없다고 브라우저가 favicon.ico를 찾다가 404 에러를 내지 않게 한다 -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <!-- 싱크 조절: 판정이 늦거나 빠르게 느껴질 때 맞춘다 (+면 조금 늦게 눌러도 정확하게 판정) -->
  <div class="sync">
    <label for="sync">싱크 조절</label>
    <button id="sync-minus" type="button" aria-label="싱크 10ms 빠르게">−</button>
    <input id="sync" type="range" step="10" value="0">
    <button id="sync-plus" type="button" aria-label="싱크 10ms 늦게">+</button>
    <output id="sync-value" for="sync">0ms</output>
  </div>
</body>
</html>
